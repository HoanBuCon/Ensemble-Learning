# ============================================================
# Swin Transformer Tiny Baseline Configuration
# ============================================================

experiment_name: swin_tiny_baseline
seed: 42

model:
  name: swin_tiny
  pretrained: true
  num_classes: 6
  drop_rate: 0.0

data:
  root: ./data
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true

augmentation:
  train:
    horizontal_flip: 0.5
    vertical_flip: 0.0
    rotation_limit: 15
    brightness_limit: 0.2
    contrast_limit: 0.2
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  val:
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  test:
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

train:
  epochs: 50
  optimizer: adamw
  lr: 5.0e-5
  weight_decay: 5.0e-2
  scheduler: cosine
  warmup_epochs: 5
  early_stopping_patience: 10
  mixed_precision: true
  gradient_clip_value: 5.0
  label_smoothing: 0.1

checkpoint:
  save_dir: ./outputs/swin_tiny
  save_best: true
  save_last: true
  monitor: val_accuracy
  mode: max

logging:
  tensorboard: true
  csv: true
  console: true

device: auto
