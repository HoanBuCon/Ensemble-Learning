# ============================================================
# ResNet-50 Baseline Configuration
# ============================================================

experiment_name: resnet50_baseline
seed: 42

model:
  name: resnet50
  pretrained: true
  drop_rate: 0.0

data:
  root: ./data
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true

augmentation:
  train:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation_limit: 15
    brightness_limit: 0.2
    contrast_limit: 0.2
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  val:
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  test:
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

train:
  epochs: 30
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 3
  early_stopping_patience: 6
  mixed_precision: true
  gradient_clip_value: 1.0
  label_smoothing: 0.1

checkpoint:
  save_dir: ./RESULTS/DEFAULT_TRAINING/outputs/resnet50
  save_best: true
  save_last: true
  monitor: val_accuracy
  mode: max
  loss_gate_tolerance: 0.05

logging:
  tensorboard: true
  csv: true
  console: true

device: auto
