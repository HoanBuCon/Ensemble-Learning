# Frozen protocol configuration for new final experiments.
dataset:
  root: ./data
  manifest: ./artifacts/manifests/dataset_manifest.csv
  snapshot: ./artifacts/manifests/dataset_snapshot.json

results:
  root: ./RESULTS/FINAL_V2
  single_split: ./RESULTS/FINAL_V2/single_split
  oof: ./RESULTS/FINAL_V2/oof
  verification: ./RESULTS/FINAL_V2/verification

protocol:
  seed: 42
  n_splits: 5
  shuffle: true
  split_random_state: 42
  external_validation_names:
    - val
    - valid

training_invariants:
  optimizer: adamw
  batch_size: 32
  epochs: 30
  warmup_epochs: 3
  early_stopping_patience: 6
  label_smoothing: 0.1
  scheduler: cosine
  checkpoint_monitor: val_accuracy
  checkpoint_mode: max
  loss_gate_tolerance: 0.05

latency:
  batch_size: 1
  input_shape: [1, 3, 224, 224]
  gpu_warmup: 50
  gpu_iterations: 200
  cpu_warmup: 20
  cpu_iterations: 100
  repeats: 5

